<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start a Project | Matías Ibarra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:ital,wght@0,400;0,500;0,700;1,400;1,700&amp;family=Inter:wght@300;400;500;700&amp;display=swap" rel="stylesheet">

<style>
:root {
  --white: #fff;
  --black: #000;
  --card-bg: rgba(0, 0, 0, 0.4); /* Fondo más transparente para integrar con el video */
  --text-muted: rgba(255, 255, 255, 0.65);
  --nav-h: 72px;
}

/* ─── VIDEO DE FONDO ─── */
.video-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: -1;
  object-fit: cover;
  pointer-events: none;
}
.video-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); /* Oscurece el video para legibilidad */
  z-index: -1;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #000;
  color: #fff;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
a { text-decoration: none; color: inherit; }

/* ─── NAVBAR MEJORADA ─── */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--nav-h);
  display: flex;
  align-items: center;
  padding: 0 clamp(18px, 4vw, 40px);
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
  z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

/* ─── LAYOUT Y FORMULARIO (Actualizados para transparencia) ─── */
.contact-container {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  max-width: 1200px;
  margin: calc(var(--nav-h) + 60px) auto 60px;
  padding: 0 clamp(18px, 5vw, 40px);
  gap: 80px;
}
.form-panel {
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(20px);
  padding: 40px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
}

/* ... (Mantén aquí el resto de tus estilos de botones, inputs y steps originales) ... */

/* ─── ANIMACIONES MEJORADAS ─── */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>
<body>

  <video autoplay muted loop playsinline class="video-bg">
    <source src="Fondo.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>

  <nav class="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="back-link">← Back to Portfolio</a>
    </div>
  </nav>

  <main class="contact-container">
    </main>

  <script>
    // Tu script de IntersectionObserver sigue funcionando perfecto
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });
    
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
